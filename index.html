<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Component Tutorial Starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <main class="flex items-center justify-center min-h-screen font-primary bg-black">
      <div data-name="frame" class="relative size-135 bg-[#141414] isolate overflow-hidden text-[13px] text-white">
        <!-- icon -->
        <div class="size-18 absolute z-2 left-1/2 -translate-x-1/2 top-[198px]">
          <div class="size-full relative z-3 bg-[#080808] rounded-full corner-round shadow-[0px_110px_31px_rgba(0,0,0,0.01),0px_71px_28px_rgba(0,0,0,0.06),0px_40px_24px_rgba(0,0,0,0.2),0px_18px_18px_rgba(0,0,0,0.34),0px_4px_10px_rgba(0,0,0,0.39)] bg-linear-to-t from-white/8 to-transparent">
            <figure data-animated-icons class="absolute left-1/2 top-1/2 -translate-1/2">
              <!-- 7×7 pixel grid (row by row, left to right). Hidden by default: every icon lights up a subset of these cells -->
              <svg class="*:opacity-0" width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="white" stroke-width="2" stroke-linecap="square" xmlns="http://www.w3.org/2000/svg">
                <!-- row 1 -->
                <path d="M3 3H3.01"/>
                <path d="M7 3H7.01"/>
                <path d="M11 3H11.01"/>
                <path d="M15 3H15.01"/>
                <path d="M19 3H19.01"/>
                <path d="M23 3H23.01"/>
                <path d="M27 3H27.01"/>
                <!-- row 2 -->
                <path d="M3 7H3.01"/>
                <path d="M7 7H7.01"/>
                <path d="M11 7H11.01"/>
                <path d="M15 7H15.01"/>
                <path d="M19 7H19.01"/>
                <path d="M23 7H23.01"/>
                <path d="M27 7H27.01"/>
                <!-- row 3 -->
                <path d="M3 11H3.01"/>
                <path d="M7 11H7.01"/>
                <path d="M11 11H11.01"/>
                <path d="M15 11H15.01"/>
                <path d="M19 11H19.01"/>
                <path d="M23 11H23.01"/>
                <path d="M27 11H27.01"/>
                <!-- row 4 -->
                <path d="M3 15H3.01"/>
                <path d="M7 15H7.01"/>
                <path d="M11 15H11.01"/>
                <path d="M15 15H15.01"/>
                <path d="M19 15H19.01"/>
                <path d="M23 15H23.01"/>
                <path d="M27 15H27.01"/>
                <!-- row 5 -->
                <path d="M3 19H3.01"/>
                <path d="M7 19H7.01"/>
                <path d="M11 19H11.01"/>
                <path d="M15 19H15.01"/>
                <path d="M19 19H19.01"/>
                <path d="M23 19H23.01"/>
                <path d="M27 19H27.01"/>
                <!-- row 6 -->
                <path d="M3 23H3.01"/>
                <path d="M7 23H7.01"/>
                <path d="M11 23H11.01"/>
                <path d="M15 23H15.01"/>
                <path d="M19 23H19.01"/>
                <path d="M23 23H23.01"/>
                <path d="M27 23H27.01"/>
                <!-- row 7 -->
                <path d="M3 27H3.01"/>
                <path d="M7 27H7.01"/>
                <path d="M11 27H11.01"/>
                <path d="M15 27H15.01"/>
                <path d="M19 27H19.01"/>
                <path d="M23 27H23.01"/>
                <path d="M27 27H27.01"/>
              </svg>
            </figure>

            <span class="absolute inset-0 rounded-[inherit] corner-round bg-linear-to-tl from-[#303030] via-[#050505] to-[#616161] p-px mask-clip-padding-only via-65% pointer-events-none"></span>
          </div>

          <!-- frame -->
          <span class="absolute z-1 inset-[0.5px] ring-1 ring-white/7"></span>

          <!-- corners -->
          <div class="absolute -left-[0.5px] -top-[0.5px] size-3">
            <span class="block w-[5px] h-px absolute top-0 left-px bg-white/25"></span>
            <span class="block w-px h-[6px] absolute top-0 left-0 bg-white/25"></span>
          </div>

          <div class="absolute -right-[0.5px] -top-[0.5px] size-3">
            <span class="block w-[5px] h-px absolute top-0 right-px bg-white/25"></span>
            <span class="block w-px h-[6px] absolute top-0 right-0 bg-white/25"></span>
          </div>

          <div class="absolute -right-[0.5px] -bottom-[0.5px] size-3">
            <span class="block w-[5px] h-px absolute bottom-0 right-px bg-white/25"></span>
            <span class="block w-px h-[6px] absolute bottom-0 right-0 bg-white/25"></span>
          </div>

          <div class="absolute -left-[0.5px] -bottom-[0.5px] size-3">
            <span class="block w-[5px] h-px absolute bottom-0 left-px bg-white/25"></span>
            <span class="block w-px h-[6px] absolute bottom-0 left-0 bg-white/25"></span>
          </div>
        </div>

        <!-- steps -->
        <div data-animated-steps class="invisible h-[56px] absolute z-2 top-[282px] left-1/2 -translate-x-1/2 overflow-hidden mask-y-from-50% mask-y-to-95% perspective-[120px]">
          <ul class="flex flex-col transform-3d gap-[4px] transition-transform duration-700 ease-spring motion-reduce:transition-none">
            <li data-active class="h-4 flex items-center justify-center opacity-30 data-active:opacity-100 transition-[opacity,transform] duration-700 ease-spring">Downloading required assets</li>
            <li class="h-4 flex items-center justify-center opacity-30 data-active:opacity-100 transition-[opacity,transform] duration-700 ease-spring">Checking for potential issues</li>
            <li class="h-4 flex items-center justify-center opacity-30 data-active:opacity-100 transition-[opacity,transform] duration-700 ease-spring">Building your workspace</li>
            <li class="h-4 flex items-center justify-center opacity-30 data-active:opacity-100 transition-[opacity,transform] duration-700 ease-spring">You're all set!</li>
          </ul>
        </div>

        <!-- bg grid -->
        <figure class="absolute inset-0 pointer-events-none z-1">
          <img src="/images/grid.svg" alt="" class="" />
        </figure>
      </div>
    </main>

    <!-- background noise -->
    <figure class="bg-noise fixed z-100 pointer-events-none" aria-hidden="true">
      <svg>
        <filter id="noise-bg-fx">
          <feTurbulence baseFrequency="0.8" />
        </filter>
      </svg>
    </figure>

    <script type="module" src="/main.js"></script>
  </body>
</html>
